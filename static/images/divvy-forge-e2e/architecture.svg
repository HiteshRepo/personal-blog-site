<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', monospace" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b7280"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="540" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="430" y="34" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="bold">divvy-forge — Agent Architecture</text>

  <!-- ── batch_runner ── -->
  <rect x="330" y="55" width="200" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="430" y="73" text-anchor="middle" fill="#94a3b8" font-size="11">entry point</text>
  <text x="430" y="90" text-anchor="middle" fill="#f1f5f9" font-weight="bold">batch_runner.py</text>

  <!-- arrow down -->
  <line x1="430" y1="99" x2="430" y2="128" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── TrueForge Session ── -->
  <rect x="280" y="130" width="300" height="44" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="430" y="148" text-anchor="middle" fill="#a5b4fc" font-size="11">TrueForge</text>
  <text x="430" y="165" text-anchor="middle" fill="#f1f5f9" font-weight="bold">Session + Turn (SSE stream)</text>

  <!-- arrow down -->
  <line x1="430" y1="174" x2="430" y2="203" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Coordinator Agent ── -->
  <rect x="265" y="205" width="330" height="44" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="430" y="223" text-anchor="middle" fill="#93c5fd" font-size="11">gpt-4o · coordinator prompt</text>
  <text x="430" y="240" text-anchor="middle" fill="#f1f5f9" font-weight="bold">Coordinator Agent</text>

  <!-- arrows to subagents -->
  <line x1="360" y1="249" x2="220" y2="298" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="500" y1="249" x2="640" y2="298" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- ── Fundamentals Subagent ── -->
  <rect x="80" y="300" width="270" height="54" rx="8" fill="#14532d" stroke="#10b981" stroke-width="1.5"/>
  <text x="215" y="320" text-anchor="middle" fill="#6ee7b7" font-size="11">fundamentals-analysis</text>
  <text x="215" y="338" text-anchor="middle" fill="#f1f5f9" font-weight="bold">Fundamentals Subagent</text>
  <text x="215" y="353" text-anchor="middle" fill="#86efac" font-size="11">yield trend · payout · sandbox code</text>

  <!-- ── Risk Subagent ── -->
  <rect x="510" y="300" width="270" height="54" rx="8" fill="#431407" stroke="#f97316" stroke-width="1.5"/>
  <text x="645" y="320" text-anchor="middle" fill="#fdba74" font-size="11">dividend-cut-risk</text>
  <text x="645" y="338" text-anchor="middle" fill="#f1f5f9" font-weight="bold">Risk Subagent</text>
  <text x="645" y="353" text-anchor="middle" fill="#fed7aa" font-size="11">news search · signal classification</text>

  <!-- arrows back to coordinator -->
  <line x1="220" y1="354" x2="360" y2="388" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="640" y1="354" x2="500" y2="388" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- ── Merge + Diff ── -->
  <rect x="265" y="390" width="330" height="44" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="430" y="408" text-anchor="middle" fill="#c4b5fd" font-size="11">merge findings · generate unified diff</text>
  <text x="430" y="425" text-anchor="middle" fill="#f1f5f9" font-weight="bold">coordinator-output block</text>

  <!-- arrow down -->
  <line x1="430" y1="434" x2="430" y2="463" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── GitHub PR ── -->
  <rect x="295" y="465" width="270" height="44" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="430" y="483" text-anchor="middle" fill="#6ee7b7" font-size="11">github-pr-opener MCP</text>
  <text x="430" y="500" text-anchor="middle" fill="#f1f5f9" font-weight="bold">GitHub PR · HiteshRepo/stock-screeners</text>

  <!-- ── MCP Tools (right side) ── -->
  <rect x="700" y="155" width="145" height="34" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="772" y="168" text-anchor="middle" fill="#94a3b8" font-size="10">MCP tool</text>
  <text x="772" y="182" text-anchor="middle" fill="#e2e8f0" font-size="12">divvy-reader</text>

  <rect x="700" y="200" width="145" height="34" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="772" y="213" text-anchor="middle" fill="#94a3b8" font-size="10">MCP tool</text>
  <text x="772" y="227" text-anchor="middle" fill="#e2e8f0" font-size="12">market-data-fetcher</text>

  <!-- connector lines from coordinator to MCP tools -->
  <line x1="595" y1="220" x2="698" y2="196" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="595" y1="230" x2="698" y2="218" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ── Daytona sandbox ── -->
  <rect x="700" y="300" width="145" height="44" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="772" y="318" text-anchor="middle" fill="#fcd34d" font-size="10">Daytona sandbox</text>
  <text x="772" y="334" text-anchor="middle" fill="#e2e8f0" font-size="12">code execution</text>

  <!-- connector line from fundamentals subagent to Daytona -->
  <line x1="350" y1="330" x2="698" y2="320" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- legend -->
  <line x1="50" y1="510" x2="80" y2="510" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="85" y="514" fill="#94a3b8" font-size="11">main flow</text>
  <line x1="170" y1="510" x2="200" y2="510" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="205" y="514" fill="#94a3b8" font-size="11">MCP tool call</text>
  <line x1="310" y1="510" x2="340" y2="510" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="345" y="514" fill="#94a3b8" font-size="11">sandbox execution</text>
</svg>
